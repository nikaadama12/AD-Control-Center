name: Windows build and tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore ADControlCenter.sln
      - run: dotnet build ADControlCenter.sln -c Release --no-restore
      - run: dotnet test ADControlCenter.sln -c Release --no-build
